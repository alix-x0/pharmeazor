version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: qdrant-project-rcr
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__ENABLE_DASHBOARD=true
